name: Relato de bug
description: Reporte um comportamento errado ou inesperado no Sitrus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Antes de enviar: **nunca** cole cookies,
        `media-user-token` ou dados da sua conta Apple nos logs — sanitize antes
        (veja [SECURITY.md](../../SECURITY.md)).
  - type: textarea
    id: descricao
    attributes:
      label: Descrição do bug
      description: O que aconteceu e o que você esperava que acontecesse?
      placeholder: Ao clicar em..., o app... mas deveria...
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Passos para reproduzir
      description: Liste os passos numerados, do início do app até o erro.
      placeholder: |
        1. Abra o Sitrus
        2. Vá em Playlists
        3. ...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do Sitrus
      description: Versão do release ou commit do build local.
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: Distribuição, sessão gráfica e formato de instalação.
      placeholder: |
        - Distro: Fedora 45
        - Sessão: Wayland (KDE)
        - Instalação: AppImage / RPM / build local
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Saída de terminal ou logs do app (sanitizados, sem tokens/cookies).
      render: shell
    validations:
      required: false
