name: Spike EME / WebKitGTK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eme-probe:
    name: Render EME probe on WebKitGTK (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK, D-Bus and virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev xvfb
      - name: Install Rust stable
        run: rustup update stable --no-self-update && rustup default stable
      - name: Build and run the rendered WebKitGTK probe
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a cargo run --locked -p eme-probe --features webview 2>&1 | tee spike/eme-probe/eme-probe.log
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eme-probe-log
          path: spike/eme-probe/eme-probe.log
          if-no-files-found: error
          retention-days: 14
