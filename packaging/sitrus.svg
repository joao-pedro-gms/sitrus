  <title>Sitrus</title>

  <rect width="512" height="512" rx="112" fill="#1D1D1F"/>

  <circle cx="264" cy="268" r="146" fill="#FF9F0A"/>
  <circle cx="264" cy="268" r="118" fill="#FFB340"/>

  <g stroke="#FFE8C2" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="264" y1="156" x2="264" y2="380"/>
    <line x1="152" y1="268" x2="376" y2="268"/>
    <line x1="185" y1="189" x2="343" y2="347"/>
