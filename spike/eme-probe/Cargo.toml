[package]
name = "eme-probe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
webview = ["dep:gtk", "dep:wry"]

[dependencies]
gtk = { version = "0.18", optional = true }
wry = { version = "0.57.3", default-features = false, features = ["os-webview"], optional = true }
